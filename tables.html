<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>
</head>
<body>
    <table border="">
        <caption>Its my table demonstration</caption>
        <colgroup>
            <col span="1" style="background-color: red;">
            <col span="1" style="background-color: yellow;">
            <col span="1" style="background-color: green;">
            <col span="1" style="background-color: blue;">
        </colgroup>
        <!--Mdn Table-->
        <!--span For Table Span-->
        <!--colgroup For Table Column Group-->
        <!--rowspan For Table Row Span-->
        <!--table For Table Tag-->
        <!--tr For Table Row-->
        <!--thead For Table Header-->
        <!--tbody For Table Body-->
        <!--tfoot For Table Footer-->   
        <thead>
            <tr>
            <!-- th: table header-->
            <th>col-1</th>
            <th>col-2</th>
            <th>col-3</th>
            <th>col-4</th>
        </tr>
        </thead>
        <tbody>
            <tr>
            <!-- td: table data-->
             <td rowspan="3">1</td>
             <td colspan="3">2</td>
             <td>3</td>
             <td>4</td>
        </tr>

        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
            <td>8</td>
        </tr>

        <tr>
            <td>9</td>
            <td>10</td>
            <td>11</td>
            <td>12</td>
        </tr>

        <tr>
            <td>13</td>
            <td>14</td>
            <td>15</td>
            <td>16</td>
        </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>17</td>
                <td>18</td>
                <td>19</td>
                <td>20</td>
            </tr>
        </tfoot>
        
        
    </table>
</body>
</html>
